[project]
name = "gridcast"
version = "0.1.0"
description = "Pre-connection electricity demand estimation for mini-grids"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
