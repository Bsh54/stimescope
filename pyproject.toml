[project]
name = "gridcast"
version = "0.1.0"
description = "Pre-connection electricity demand estimation for mini-grids"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
